buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        // DBFlow, AppIntro and ClipboardManagerCompat are only published on JitPack.
        maven {
            url "https://jitpack.io"
            content {
                includeGroup "com.github.Raizlabs.DBFlow"
                includeGroup "com.github.AppIntro"
                includeGroup "com.github.sschueller"
                includeGroup "com.github.agrosner"
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
